[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nsgeo"
version = "0.1.0.dev0"
description = "Near-surface geophysics: survey processing, analysis, and visualisation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.5", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
# 3.12, not the package's 3.9 floor: numpy >= 2 ships stubs using PEP 695
# `type` statements, which mypy rejects below 3.12. Runtime 3.9 compatibility
# is guarded by the CI 3.9 matrix job and ruff's py39 target, not by mypy, so
# requires-python stays >= 3.9.
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# Deliberately not `strict = true`: numpy's stubs and the step-registry
# decorator produce a stream of Any-related errors that would be silenced
# with ignores rather than fixed, which is worse than not asking.
